<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 -18 132 132" fill="none">
  <!-- Favicon: the prism at favicon scale. This is the COMPACT branch of the
       hand-authored <BrandMark> (src/app/_components/ui.tsx) as a static
       document — same geometry, brand token values hardcoded because a
       favicon cannot read the page's CSS custom properties. The media query
       below mirrors globals.css: light values by default, dark render when
       the browser chrome is dark. Square crop of the 160x96 drawing, centred
       on the mark (beam tail cropped — at 16px it reads as noise). -->
  <style>
    .beam { stroke: #b8860b; }
    .ray { stroke: #c46a4a; }
    .structure { stroke: #1c2a45; }
    .fill-beam { fill: #b8860b; }
    .glass { fill: #c46a4a; }
    @media (prefers-color-scheme: dark) {
      .beam { stroke: #f5c75e; }
      .ray { stroke: #c8d2e2; }
      .structure { stroke: #f5c75e; }
      .fill-beam { fill: #f5c75e; }
      .glass { fill: #c8d2e2; }
    }
  </style>

  <!-- arriving ray -->
  <path d="M26 48H42" class="beam" stroke-width="3.4" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- prism: glass body + structure -->
  <path d="M42 48 76 12 76 84Z" class="glass" fill-opacity="0.14" />
  <path d="M42 48 76 12 76 84Z" class="structure" stroke-width="3.2" stroke-linejoin="round" />

  <!-- refracted fan: three rays at compact weight -->
  <g stroke-width="2.6" stroke-linecap="round">
    <path d="M43 48 106 36" class="ray" stroke-opacity="0.82" />
    <path d="M43 48 106 48" class="ray" />
    <path d="M43 48 106 60" class="beam" stroke-opacity="0.82" />
  </g>

  <!-- flare at the apex -->
  <circle cx="42" cy="48" r="13" class="fill-beam" fill-opacity="0.22" />
  <circle cx="42" cy="48" r="3.4" class="fill-beam" />

  <!-- the record: a bracket, open on the left -->
  <path d="M104 24H134L144 34V72H104" class="beam" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" />
</svg>
